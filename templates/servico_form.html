{% extends "base.html" %}
{% block title %}Serviço{% endblock %}
{% block content %}
<h1 class="h3">{{ "Editar serviço" if servico.id else "Novo serviço" }}</h1>
<form method="post" class="card card-body">
    <label class="form-label">Nome</label>
    <input class="form-control mb-3" name="nome" value="{{ servico.nome }}" required>

    <label class="form-label">Preço (R$)</label>
    <input class="form-control mb-3" name="preco" type="number" step="0.01" min="0" value="{{ servico.preco }}" required>

    <label class="form-label">Tempo estimado</label>
    <input class="form-control mb-3" name="tempo" value="{{ servico.tempo }}" required>

    <label class="form-label">Garantia</label>
    <input class="form-control mb-3" name="garantia" value="{{ servico.garantia }}" required>

    <label class="form-label">Descrição</label>
    <textarea class="form-control mb-3" name="descricao" required>{{ servico.descricao }}</textarea>

    <div>
        <button class="btn btn-warning">Salvar</button>
        <a href="{{ url_for('listar_servicos') }}" class="btn btn-link">Cancelar</a>
    </div>
</form>
{% endblock %}
