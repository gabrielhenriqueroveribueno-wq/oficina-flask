{% extends "base.html" %}
{% block title %}{{ servico.nome }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <h1 class="h3">{{ servico.nome }}</h1>
        <p class="lead">{{ servico.descricao }}</p>
        <p><strong>Preço:</strong> {{ servico.preco|brl }}</p>
        <p><strong>Tempo estimado:</strong> {{ servico.tempo }}</p>
        <p><strong>Garantia:</strong> {{ servico.garantia }}</p>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Voltar</a>
    </div>
</div>
{% endblock %}
